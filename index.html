<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botão com JavaScript</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <h1>Personalizar texto</h1>
        
        <form id="formEstilo">
            <label for="campoCor">Cor (nome ou hex)</label>
            <br>
            <input type="text" id="campoCor" placeholder="ex. red ou #ff0000">
            <br><br>
            <label for="campoPadding">Padding (px)</label>
            <br>
            <input type="text" id="campoPadding" placeholder="ex: 10px">
            <br><br>
            <label for="campoTamanho">Tamanho da letra (px)</label>
            <br>
            <input type="number" id="campoTamanho" placeholder="ex: 20px">
            <br><br>
            <button type="submit">Aplicar</button>
        </form>
        <p id="retorno">Esta é sua mensagem!</p>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
