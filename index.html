<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Roupas lindas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>👔Loja de Roupas👘</h1>
    </header>
    <main class="carrosel">
        <div class="trilho">
            <div class="slide">
                <img src="img/0275cd32739a6a2012ca26db9240c84f.jpg" alt="camisa">
                <h2 class="Real">Camiseta Real Madrid</h2>
                <p class="preco">R$ 290,99</p>
            </div>
            <div class="slide">
                <img src="img/51ipBmqPlDL._AC_SY606_.jpg" alt="jaqueta">
                <h2 class="roupa">Jaqueta</h2>
                <p class="preco">R$ 67,90</p>
            </div>
            <div class="slide">
                <img src="img/71cF8o8l+SL._AC_SX625_.jpg" alt="tenis">
                <h2 class="roupa">Air Jordan 4 Retro</h2>
                <p class="preco">R$ 2.490,90</p>
            </div>
            <div class="slide">
                <img src="img/D_NQ_NP_935841-MLM74939539841_032024-O-vestido-estampado-batman.webp" alt="vestio">
                <h2 class="roupa">Vestido Batman</h2>
                <p class="preco">R$ 9,90</p>
            </div>
            <div class="slide">
                <img src="img/M0Y1CX04A3.jpg" alt="calca">
                <h2 class="roupa">Calça Brasil</h2>
                <p class="preco">R$ 290,99</p>
            </div>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
