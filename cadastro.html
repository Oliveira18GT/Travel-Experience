<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Travel Experience</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="js/script.js">
</head>
<body>
    
    <header>
        <h1>✈️ Travel Experience</h1>
        <p></p>
        <nav>
            <a href="index.html">Início</a>
            <a href="index.html#destino">Destinos</a>  
        </nav>
    </header>

    <main class="area-cadastro">
        <form id="formCadastro">
            <h2>Planeje sua próxima viagem!</h2>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>
                <br>
            <label for="nome">Email:</label>
            <input type="text" id="email" placeholder="Digite seu email" required>
                <br>
            <label for="destino">Destino desejado:</label>
            <select id="destino" required>
                <option value="">Escolha um destino</option>
                <option value="Rio de Janeiro">Rio de Janeiro</option>
                <option value="Paris">Paris</option>
                <option value="Maldivas">Maldivas</option>
            </select>
            <br>
            <button type="submit">Enviar cadastro</button>
            <p id="mensagem" aria-live="polite"></p>
            <a href="index.html" class="voltar">Voltar para o início</a>
            
        </form>
        <footer>
            <p class="copyright2">&copy; 2026 Travel Experience. Todos os direitos reservados.</p>
        </footer>
    </main>

</body>
</html>
